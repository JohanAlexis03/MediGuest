<svg viewBox="0 0 520 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rod of Asclepius -->
  <g id="rod-of-asclepius" transform="translate(10, 10)">
    <!-- Blue Central Staff -->
    <path d="M 38 12 V 152" stroke="#1D4ED8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="38" cy="12" r="4.5" fill="#1D4ED8"/>

    <!-- Snake Twisting -->
    <path d="M 22 28 C 22 20, 38 18, 48 24 C 54 28, 54 36, 46 40 C 38 44, 22 46, 22 56 C 22 66, 48 64, 52 74 C 56 84, 24 88, 26 100 C 28 112, 50 114, 48 126 C 46 136, 36 142, 38 152" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 54 28 C 54 20, 38 18, 28 24 C 22 28, 22 36, 30 40 C 38 44, 54 46, 54 56 C 54 66, 28 64, 24 74 C 20 84, 52 88, 50 100 C 48 112, 26 114, 28 126 C 30 136, 40 142, 38 152" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark & Slogan -->
  <g id="brand-typography">
    <text x="85" y="88" fill="#111827" font-family="'Inter', -apple-system, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.2px">
      MediQuest
    </text>
    <text x="90" y="118" fill="#1F2937" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="-0.2px">
      Aprende. Practica. Salva vidas
    </text>
  </g>

  <!-- Red Ambulance with ECG Heartbeat -->
  <g id="ambulance-ecg" transform="translate(190, 0)">
    <path d="M 126 32 C 126 26, 138 26, 138 32 V 42 H 126 Z" fill="#DC2626"/>
    <path d="M 98 44 H 156 V 58 H 194 L 224 96 H 244 V 136 H 220" stroke="#DC2626" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 28 136 V 112 H 42 V 136" stroke="#DC2626" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="70" cy="136" r="22" fill="#DC2626"/>
    <circle cx="186" cy="136" r="22" fill="#DC2626"/>
    <path d="M 6 150 H 68" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/>
    <path d="M 194 150 H 228" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/>
    <path d="M 88 136 H 98 L 106 142 L 112 72 L 126 172 L 140 108 L 150 144 L 156 136 H 176" stroke="#DC2626" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
